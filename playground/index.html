<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointing playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same visual system as the Pointing Lab notebook: one accent per model, fixed everywhere.
   Layout: the screenshot is the page; controls sit under it, results beside it on wide screens. */
:root {
  --bg: #f6f7f4; --panel: #ffffff; --ink: #17201b; --muted: #5b6760; --line: #d9ded8; --soft: #eef1ec;
  --new: #1f7a4d; --old: #c0621a; --other: #3558a8; --target: #17201b; --miss: #b23b2e;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #101613; --panel: #171f1b; --ink: #e5ebe6; --muted: #98a59d; --line: #2b3630; --soft: #1c2621;
  --new: #5cc48d; --old: #e79a52; --other: #7fa2ee; --target: #e5ebe6; --miss: #ee8a7c; color-scheme: dark } }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body) }
.wrap { max-width: 1320px; margin: 0 auto; padding: 22px 20px 56px; display: grid; gap: 18px }
h1, h2 { font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance }
h1 { font-size: 28px; line-height: 1.15 }
h2 { font-size: 15px }
p { margin: 0 }
.eyebrow { font: 500 11.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.lede { color: var(--muted); max-width: 78ch }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
header { display: grid; gap: 8px }
button { font: inherit; color: inherit }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start }
@media (max-width: 1040px) { .grid { grid-template-columns: 1fr } }

/* the screenshot */
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0 }
.shot { position: relative; border-radius: 6px; overflow: hidden; background: var(--soft); line-height: 0; cursor: crosshair }
.shot img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none }
.empty { display: grid; place-items: center; gap: 14px; text-align: center; padding: 56px 20px; border: 1.5px dashed var(--line); border-radius: 8px; line-height: 1.55; cursor: default }
.empty.over { border-color: var(--new); background: var(--soft) }
.empty b { font: 600 18px/1.3 var(--display) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { all: unset; cursor: pointer; font: 600 13.5px/1 var(--body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel) }
.btn:hover { border-color: var(--ink) }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn:focus-visible, .chip:focus-within, input:focus-visible { outline: 2px solid var(--new); outline-offset: 2px }
.btn[disabled] { opacity: .45; cursor: default }
.samples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 100%; padding: 2px }
.samples button { all: unset; cursor: pointer; flex: 0 0 176px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; line-height: 0 }
.samples button:hover, .samples button:focus-visible { border-color: var(--ink) }
.samples img { width: 176px; height: 110px; object-fit: cover; object-position: center }
.samples small { display: block; font-size: 10.5px; line-height: 1.3; color: var(--muted); padding: 4px 7px; border-top: 1px solid var(--line) }

/* markers: positioned in percent of the screenshot, so they stay put at any size */
.mark { position: absolute; width: 0; height: 0; pointer-events: none }
.mark i { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: 0 0 0 1.5px var(--panel) }
.mark i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--c) }
.mark span { position: absolute; left: 14px; top: -11px; font: 600 11px/1 var(--mono); padding: 5px 7px; border-radius: 5px; background: var(--c); color: var(--panel); white-space: nowrap; box-shadow: 0 0 0 1.5px var(--panel) }
.mark.left span { left: auto; right: 14px }
.mark.first i { width: 14px; height: 14px; left: -7px; top: -7px; background: transparent; border-style: dashed; border-width: 1.5px }
.mark.first i::after { display: none }
.window { position: absolute; border: 1.5px dashed var(--c); border-radius: 3px; pointer-events: none; opacity: .8 }
.tbox { position: absolute; border: 2px solid var(--target); border-radius: 3px; box-shadow: 0 0 0 1px var(--panel), inset 0 0 0 1px var(--panel); pointer-events: none }
.target { position: absolute; width: 0; height: 0; pointer-events: none }
.target::before, .target::after { content: ""; position: absolute; background: var(--target); box-shadow: 0 0 0 1px var(--panel) }
.target::before { left: -13px; top: -1px; width: 26px; height: 2px }
.target::after { left: -1px; top: -13px; width: 2px; height: 26px }

/* controls */
.ask { display: grid; gap: 10px; margin-top: 10px }
.ask input[type=text] { width: 100%; font: 16px/1.4 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.hints { display: flex; flex-wrap: wrap; gap: 6px }
.hints button { all: unset; cursor: pointer; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px }
.hints button:hover { color: var(--ink); border-color: var(--ink) }
.chip { display: inline-flex; gap: 7px; align-items: center; font-size: 13.5px; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px 6px 9px; cursor: pointer; background: var(--panel); user-select: none }
.chip input { position: absolute; opacity: 0; pointer-events: none }
.chip i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--c) }
.chip:has(input:checked) { border-color: var(--c) } .chip:has(input:checked) i { background: var(--c) }
.chip.off { opacity: .5; cursor: default }
.switch { --c: var(--ink) }
.spacer { flex: 1 }

/* results */
.side { display: grid; gap: 12px }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px }
.card .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.card small { color: var(--muted); font-size: 12.5px }
.big { font: 600 22px/1.15 var(--display); font-variant-numeric: tabular-nums }
.verdict { font: 600 12px/1 var(--mono); padding: 4px 7px; border-radius: 5px; border: 1px solid currentColor }
.verdict.hit { color: var(--new) } .verdict.far { color: var(--muted) }
.facts { font-size: 12.5px; color: var(--muted) }
.facts b { color: var(--ink); font-weight: 600 }
.busy { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 7px; animation: pulse 1s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { .busy { animation: none } }
.note { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 8px; padding: 10px 12px }
code { font: 12px/1.5 var(--mono); background: var(--soft); padding: 2px 5px; border-radius: 4px; word-break: break-all }
footer { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; color: var(--muted); font-size: 13px }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Bonsai pointing · runs on this Mac</span>
    <h1>Pointing playground</h1>
    <p class="lede">Give the models a screenshot and say what to point at. Each one answers with a single spot. Click the screenshot first if you want to mark where the right answer is.</p>
  </header>

  <div class="grid">
    <div class="stage">
      <div id="shot"></div>
      <div class="ask">
        <label class="eyebrow" for="what">What should they point at?</label>
        <input id="what" type="text" autocomplete="off" placeholder="the Save button, the search field, the red close dot…">
        <div class="hints" id="hints"></div>
        <div class="row">
          <span id="chips" class="row"></span>
          <label class="chip switch" title="Answer once, zoom into that area, answer again. Slower, more precise."><input type="checkbox" id="second"><i></i>Second look</label>
          <span class="spacer"></span>
          <button class="btn" id="clear" hidden>New screenshot</button>
          <button class="btn primary" id="run" disabled>Point <span class="mono" style="opacity:.6;margin-left:6px">⌘↵</span></button>
        </div>
      </div>
    </div>

    <div class="side" id="side" aria-live="polite"></div>
  </div>

  <footer>
    <span id="mem"></span>
    <button class="btn" id="unload">Unload models from memory</button>
    <span>Nothing leaves this Mac. A model loads the first time it is used.</span>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = { new: "--new", old: "--old", other: "--other" };
const SHORT = { new: "new", old: "old", other: "4B" };
const S = { models: [], image: null, target: null, box: null, hints: [], results: {}, running: false, zoom: 3 };
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- status and model chips --------------------------------------------------------------
async function refresh() {
  const st = await api("/api/status");
  S.models = st.models; S.zoom = st.zoom;
  $("mem").textContent = st.memory_gb ? `Models in memory: ${st.memory_gb.toFixed(1)} GB` : "No model in memory";
  const checked = new Set([...document.querySelectorAll("#chips input:checked")].map((i) => i.value));
  const first = !document.querySelector("#chips input");
  $("chips").innerHTML = st.models.map((m) => `
    <label class="chip ${m.available ? "" : "off"}" style="--c:var(${COLORS[m.id]})" title="${esc(m.note)}">
      <input type="checkbox" value="${m.id}" ${m.available && (first || checked.has(m.id)) ? "checked" : ""} ${m.available ? "" : "disabled"}><i></i>${esc(m.label)}</label>`).join("");
  drawSide();
}

// ---- the screenshot ----------------------------------------------------------------------
function drawShot() {
  const el = $("shot");
  if (!S.image) {
    el.innerHTML = `<div class="empty" id="drop"><b>Drop a screenshot here</b>
      <div class="row" style="justify-content:center"><button class="btn primary" id="pick">Choose a file</button>
      <button class="btn" id="grab">Capture a screen or window</button></div>
      <span style="color:var(--muted);font-size:13px">or paste one with ⌘V, or start from a sample</span>
      <div class="samples" id="samples"></div><input type="file" id="file" accept="image/*" hidden></div>`;
    $("pick").onclick = () => $("file").click();
    $("file").onchange = (e) => e.target.files[0] && useFile(e.target.files[0]);
    $("grab").onclick = capture;
    const d = $("drop");
    d.ondragover = (e) => { e.preventDefault(); d.classList.add("over"); };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = (e) => { e.preventDefault(); d.classList.remove("over"); e.dataTransfer.files[0] && useFile(e.dataTransfer.files[0]); };
    api("/api/samples").then((list) => {
      $("samples").innerHTML = list.map((s, i) => `<button aria-label="Sample screenshot" data-i="${i}"><img src="${s.url}" alt="">${s.note ? `<small>${esc(s.note)}</small>` : ""}</button>`).join("");
      $("samples").querySelectorAll("button").forEach((b) => b.onclick = async () => {
        const s = list[+b.dataset.i];
        const blob = await (await fetch(s.url)).blob();
        await useFile(blob, s.hints);
      });
    });
    $("clear").hidden = true;
    return;
  }
  $("clear").hidden = false;
  const marks = [];
  if (S.box) marks.push(`<div class="tbox" style="left:${S.box[0] * 100}%;top:${S.box[1] * 100}%;width:${(S.box[2] - S.box[0]) * 100}%;height:${(S.box[3] - S.box[1]) * 100}%"></div>`);
  else if (S.target) marks.push(`<div class="target" style="left:${S.target[0] * 100}%;top:${S.target[1] * 100}%"></div>`);
  for (const [id, r] of Object.entries(S.results)) {
    if (!r || !r.point) continue;
    const c = `--c:var(${COLORS[id]})`;
    if (r.second) {
      const w = r.second.window;
      marks.push(`<div class="window" style="${c};left:${w[0] * 100}%;top:${w[1] * 100}%;width:${w[2] * 100}%;height:${w[3] * 100}%"></div>`);
      if (r.first.point) marks.push(`<div class="mark first" style="${c};left:${r.first.point[0] * 100}%;top:${r.first.point[1] * 100}%"><i></i></div>`);
    }
    marks.push(`<div class="mark ${r.point[0] > 0.86 ? "left" : ""}" style="${c};left:${r.point[0] * 100}%;top:${r.point[1] * 100}%"><i></i><span>${SHORT[id]}</span></div>`);
  }
  el.innerHTML = `<div class="shot" id="pic" title="Click to mark where the right answer is"><img src="${S.image.url}" alt="The screenshot the models are looking at">${marks.join("")}</div>`;
  $("pic").onclick = (e) => {
    const b = $("pic").getBoundingClientRect();
    S.box = null;
    S.target = [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height];
    drawShot(); drawSide();
  };
}

async function useFile(blob, hints) {
  const data = await new Promise((ok) => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(blob); });
  const up = await api("/api/image", { data });
  S.image = { id: up.id, url: data, w: up.width, h: up.height };
  S.target = null; S.box = null; S.results = {};
  S.hints = hints || [];                       // [{q, box?}]: box is the known target, in fractions of the screenshot
  $("hints").innerHTML = S.hints.map((h, i) => `<button data-i="${i}">${esc(h.q)}</button>`).join("");
  $("hints").querySelectorAll("button").forEach((b) => b.onclick = () => {
    const h = S.hints[+b.dataset.i];
    $("what").value = h.q;
    S.box = h.box || null;
    S.target = h.box ? [(h.box[0] + h.box[2]) / 2, (h.box[1] + h.box[3]) / 2] : null;
    if (!S.running) S.results = {};
    drawShot(); drawSide(); ready(); $("what").focus();
  });
  drawShot(); drawSide(); ready();
}

async function capture() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const v = document.createElement("video");
    v.srcObject = stream; await v.play();
    await new Promise((ok) => setTimeout(ok, 350));          // let the first full frame arrive
    const c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    stream.getTracks().forEach((t) => t.stop());
    c.toBlob((b) => useFile(b), "image/png");
  } catch (e) { /* the user closed the picker */ }
}
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
  if (item) useFile(item.getAsFile());
});

// ---- results -----------------------------------------------------------------------------
function drawSide() {
  const chosen = new Set([...document.querySelectorAll("#chips input:checked")].map((i) => i.value));
  $("side").innerHTML = S.models.map((m) => {
    const c = `--c:var(${COLORS[m.id]})`, r = S.results[m.id];
    let body;
    if (!m.available) {
      body = `<small>Not on this Mac yet. It is a 3.1 GB download:</small><code>~/Bonsai-demo/.venv-vlm/bin/hf download ${esc(m.get || "")} --local-dir ${esc(m.path)}</code>`;
    } else if (r && r.error) {
      body = `<small style="color:var(--miss)">${esc(r.error)}</small>`;
    } else if (r && r.busy) {
      body = `<div><span class="busy"></span><span class="mono" data-timer="${r.since}">0.0 s</span></div><small>${m.loaded ? "Reading the screenshot…" : "Loading the model, then reading the screenshot…"}</small>`;
    } else if (r) {
      const px = r.point ? `${Math.round(r.point[0] * S.image.w)}, ${Math.round(r.point[1] * S.image.h)}` : "no answer";
      let verdict = "";
      if (r.point && S.box) {
        const dx = Math.max(S.box[0] - r.point[0], 0, r.point[0] - S.box[2]) * S.image.w, dy = Math.max(S.box[1] - r.point[1], 0, r.point[1] - S.box[3]) * S.image.h;
        const out = Math.hypot(dx, dy);
        verdict = `<span class="verdict ${out === 0 ? "hit" : "far"}">${out === 0 ? "inside the target" : Math.round(out) + " px outside the target"}</span>`;
      } else if (r.point && S.target) {
        const d = Math.hypot((r.point[0] - S.target[0]) * S.image.w, (r.point[1] - S.target[1]) * S.image.h);
        verdict = `<span class="verdict ${d <= 24 ? "hit" : "far"}">${Math.round(d)} px from your mark</span>`;
      }
      const look = (l, name) => `<b>${name}</b> ${l.seconds.toFixed(1)} s${l.prompt_tps ? ` · reads ${Math.round(l.prompt_tps)} tokens/s` : ""}${l.prompt_tokens ? ` · ${Math.round(l.prompt_tokens)} tokens` : ""} · wrote <span class="mono">${esc(l.text)}</span>`;
      body = `<div class="who"><span class="big">${px}</span>${verdict}</div>
        <div class="facts">${look(r.first, r.second ? "First look" : "One look")}${r.second ? "<br>" + look(r.second, "Second look") : ""}
        ${r.load_seconds ? `<br>Loading the model took ${r.load_seconds} s (first use only)` : ""}</div>`;
    } else {
      body = `<small>${chosen.has(m.id) ? "Waiting for a screenshot and an instruction." : "Not selected."}</small>`;
    }
    return `<section class="card" style="${c}"><div class="who"><h2>${esc(m.label)}</h2>${r && !r.busy && !r.error ? `<span class="mono" style="font-size:13px">${r.seconds.toFixed(1)} s</span>` : ""}</div><small>${esc(m.note)}</small>${body}</section>`;
  }).join("") + (S.target ? "" : `<p class="note">Tip: click the screenshot where the right answer is. Each model's distance from your mark is then shown (a wide button can be hit well away from its centre).</p>`);
}
setInterval(() => document.querySelectorAll("[data-timer]").forEach((t) => t.textContent = ((Date.now() - +t.dataset.timer) / 1000).toFixed(1) + " s"), 100);

function ready() {
  const any = document.querySelector("#chips input:checked");
  $("run").disabled = S.running || !S.image || !$("what").value.trim() || !any;
}
async function run() {
  if ($("run").disabled) return;
  S.running = true; ready();
  const ids = [...document.querySelectorAll("#chips input:checked")].map((i) => i.value);
  S.results = {};
  for (const id of ids) {
    S.results[id] = { busy: true, since: Date.now() };
    drawShot(); drawSide();
    try {
      S.results[id] = await api("/api/point", { model: id, image: S.image.id, instruction: $("what").value, second_look: $("second").checked });
    } catch (e) { S.results[id] = { error: e.message }; }
    await refresh(); drawShot();
  }
  S.running = false; ready();
}
$("run").onclick = run;
$("what").addEventListener("input", ready);
$("chips").addEventListener("change", () => { ready(); drawSide(); });
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run(); });
$("clear").onclick = () => { S.image = null; S.results = {}; S.target = null; S.box = null; S.hints = []; $("hints").innerHTML = ""; drawShot(); drawSide(); ready(); };
$("unload").onclick = async () => { await api("/api/unload", {}); refresh(); };

drawShot();
refresh().then(ready);
</script>
</body>
</html>
